[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zubiya Ansari"}
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
